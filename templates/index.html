<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Artist Top Tracks</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 20px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #1DB954;
            text-align: center;
            margin-bottom: 30px;
        }

        .search-form {
            display: flex;
            margin-bottom: 20px;
            width: 100%;
        }

        .search-input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px 0 0 4px;
            background-color: #282828;
            color: white;
            font-size: 16px;
        }

        .search-button {
            padding: 12px 20px;
            background-color: #1DB954;
            color: white;
            border: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .search-button:hover {
            background-color: #1ed760;
        }

        .artist-info {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }

        .track-list {
            list-style-type: none;
            padding: 0;
        }

        .track-item {
            background-color: #282828;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            transition: transform 0.2s;
        }

        .track-item:hover {
            transform: translateX(5px);
            background-color: #333;
        }

        .track-number {
            color: #1DB954;
            font-weight: bold;
            margin-right: 15px;
            min-width: 25px;
        }

        .error {
            color: #ff5555;
            text-align: center;
            padding: 20px;
        }

        .loading {
            color: #1DB954;
            text-align: center;
            padding: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Spotify Top Tracks Finder</h1>
        
        <form class="search-form" id="search-form">
            <input type="text" class="search-input" id="artist-input" placeholder="Enter artist name..." required>
            <button type="submit" class="search-button">Search</button>
        </form>
        
        <div id="loading" class="loading">Loading...</div>
        
        <div id="artist-info" class="artist-info" style="display: none;">
            <h2 id="artist-name"></h2>
        </div>
        
        <ul id="track-list" class="track-list">
            <!-- Tracks will be inserted here by JavaScript -->
        </ul>
        
        <div id="error-message" class="error" style="display: none;">
            Artist not found or error loading data.
        </div>
    </div>

    <script>
        document.getElementById('search-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const artistName = document.getElementById('artist-input').value.trim();
            
            if (!artistName) return;
            
            // Show loading, hide other elements
            document.getElementById('loading').style.display = 'block';
            document.getElementById('artist-info').style.display = 'none';
            document.getElementById('track-list').innerHTML = '';
            document.getElementById('error-message').style.display = 'none';
            
            try {
                const response = await fetch(`/api/top-tracks/${encodeURIComponent(artistName)}`);
                const data = await response.json();
                
                if (response.ok) {
                    // Display artist info
                    document.getElementById('artist-name').textContent = data.artist;
                    document.getElementById('artist-info').style.display = 'block';
                    
                    // Display tracks
                    const trackList = document.getElementById('track-list');
                    if (data.tracks && data.tracks.length > 0) {
                        data.tracks.forEach((track, index) => {
                            const li = document.createElement('li');
                            li.className = 'track-item';
                            
                            li.innerHTML = `
                                <span class="track-number">${index + 1}</span>
                                <span class="track-name">${track}</span>
                            `;
                            
                            trackList.appendChild(li);
                        });
                    } else {
                        document.getElementById('error-message').textContent = 'No tracks found for this artist.';
                        document.getElementById('error-message').style.display = 'block';
                    }
                } else {
                    document.getElementById('error-message').textContent = data.error || 'Artist not found';
                    document.getElementById('error-message').style.display = 'block';
                }
            } catch (error) {
                document.getElementById('error-message').textContent = 'Failed to fetch data. Please try again.';
                document.getElementById('error-message').style.display = 'block';
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        });
    </script>
</body>
</html>
