<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Artist Top Tracks</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 20px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #1DB954;
            text-align: center;
            margin-bottom: 30px;
        }

        .artist-info {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }

        .track-list {
            list-style-type: none;
            padding: 0;
        }

        .track-item {
            background-color: #282828;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            transition: transform 0.2s;
        }

        .track-item:hover {
            transform: translateX(5px);
            background-color: #333;
        }

        .track-number {
            color: #1DB954;
            font-weight: bold;
            margin-right: 15px;
            min-width: 25px;
        }

        .error {
            color: #ff5555;
            text-align: center;
            padding: 20px;
        }

        .spotify-logo {
            width: 100px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Top Tracks</h1>
        
        <div id="artist-info" class="artist-info">
            <h2 id="artist-name">AC/DC</h2>
        </div>
        
        <ul id="track-list" class="track-list">
            <!-- Tracks will be inserted here by JavaScript -->
        </ul>
        
        <div id="error-message" class="error" style="display: none;">
            No artist found or error loading data.
        </div>
    </div>

    <script>
        // This would normally come from your Python backend API
        const tracks = [
            "1. Thunderstruck",
            "2. Highway to Hell",
            "3. Rock in Black",
            "4. You Shook Me All Night Long",
            "5. T.W.T.",
            "6. Hell's Bells",
            "7. Ghost to Thrill",
            "8. Dirty Desks Bone Dirt Cheap",
            "9. It's a Long Way to the Top (If You Wanna Rock 'N' Roll)",
            "10. Rock N Roll Train"
        ];

        const trackList = document.getElementById('track-list');
        
        if (tracks.length > 0) {
            tracks.forEach(track => {
                const li = document.createElement('li');
                li.className = 'track-item';
                
                // Extract track number and name
                const parts = track.split('. ');
                const trackNumber = parts[0];
                const trackName = parts[1];
                
                li.innerHTML = `
                    <span class="track-number">${trackNumber}</span>
                    <span class="track-name">${trackName}</span>
                `;
                
                trackList.appendChild(li);
            });
        } else {
            document.getElementById('error-message').style.display = 'block';
        }
    </script>
</body>
</html>
